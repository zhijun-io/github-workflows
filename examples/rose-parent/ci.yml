# CI workflow for rose-parent
# Place this file at .github/workflows/ci.yml in the rose-parent repository

name: CI Build

on:
  schedule:
    - cron: '0 9 * * 1-5'    # 9:00 AM UTC weekdays
    - cron: '0 21 * * 1-5'   # 9:00 PM UTC weekdays
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.repository_owner == 'zhijun-io'
    uses: zhijun-io/github-workflows/.github/workflows/ci-build.yml@main
    with:
      java-version: '17'
      maven-goals: 'clean install -B'
