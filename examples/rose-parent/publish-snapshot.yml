# Snapshot publishing workflow for rose-parent
# Place this file at .github/workflows/publish-snapshot.yml in the rose-parent repository

name: Publish Snapshot

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests for quick publishing'
        required: false
        default: false
        type: boolean

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    if: github.repository_owner == 'zhijun-io'
    uses: zhijun-io/github-workflows/.github/workflows/publish-snapshot.yml@main
    with:
      java-version: '17'
      skip-tests: ${{ inputs.skip_tests }}
    secrets:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
