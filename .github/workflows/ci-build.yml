# Reusable CI Build Workflow for Zhijun IO Projects
#
# Builds and tests a Maven project that provides ./mvnw.
#
# Usage in calling repository:
# jobs:
#   build:
#     uses: zhijun-io/github-workflows/.github/workflows/ci-build.yml@main
#     with:
#       java-version: '17'

name: CI Build

on:
  workflow_call:
    inputs:
      java-version:
        description: 'Java version to use'
        required: false
        type: string
        default: '17'
      java-distribution:
        description: 'Java distribution to use'
        required: false
        type: string
        default: 'temurin'
      maven-goals:
        description: 'Maven goals to run'
        required: false
        type: string
        default: 'clean verify -B -ntp'
      skip-tests:
        description: 'Skip running tests'
        required: false
        type: boolean
        default: false
      upload-test-results:
        description: 'Upload test results as artifact'
        required: false
        type: boolean
        default: true
      timeout-minutes:
        description: 'Maximum job runtime'
        required: false
        type: number
        default: 60

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.java-distribution }}
          cache: maven

      - name: Build with Maven
        env:
          MAVEN_GOALS: ${{ inputs.maven-goals }}
          SKIP_TESTS: ${{ inputs.skip-tests }}
        run: |
          EXTRA_ARGS=""
          if [ "$SKIP_TESTS" = "true" ]; then
            EXTRA_ARGS="-DskipTests"
          fi
          # shellcheck disable=SC2086  # goal list is intentionally word-split
          ./mvnw ${MAVEN_GOALS} ${EXTRA_ARGS}

      - name: Upload test results
        if: ${{ always() && inputs.upload-test-results }}
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 7
