# Lints the reusable workflows in this repository.
#
# The reusable workflows themselves have no triggers, so nothing else proves
# they still parse and pass shellcheck after an edit.

name: Lint Workflows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          # ubuntu-latest is amd64; re-check this URL if the runner image changes
          ASSET="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          BASE="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl -fsSLO "${BASE}/${ASSET}"
          curl -fsSL "${BASE}/actionlint_${ACTIONLINT_VERSION}_checksums.txt" \
            | grep -m1 "${ASSET}" | sha256sum -c -
          tar -xzf "${ASSET}" actionlint
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck

      - name: Run actionlint
        run: actionlint -shellcheck=shellcheck -color
