# Reusable Snapshot Publishing Workflow for Zhijun IO Projects
#
# Publishes a -SNAPSHOT version to Maven Central using ./mvnw. The project POM
# (or its parent) must declare the `central` snapshot repository in
# <distributionManagement>.
#
# Usage in calling repository:
# jobs:
#   snapshot:
#     uses: zhijun-io/github-workflows/.github/workflows/maven-snapshot.yml@main
#     secrets:
#       MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
#       MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

name: Maven Snapshot

on:
  workflow_call:
    inputs:
      java-version:
        description: 'Java version to use'
        required: false
        type: string
        default: '17'
      java-distribution:
        description: 'Java distribution to use'
        required: false
        type: string
        default: 'temurin'
      skip-tests:
        description: 'Skip running tests before publish'
        required: false
        type: boolean
        default: false
      timeout-minutes:
        description: 'Maximum job runtime'
        required: false
        type: number
        default: 60
    secrets:
      MAVEN_USERNAME:
        description: 'Maven Central username'
        required: true
      MAVEN_PASSWORD:
        description: 'Maven Central password/token'
        required: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v6.1.0
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.java-distribution }}
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Allow Central Portal as a Maven credential origin
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          settings = Path.home() / ".m2/settings.xml"
          tree = ET.parse(settings)
          root = tree.getroot()
          namespace = "http://maven.apache.org/SETTINGS/1.3.0"
          xsi = "http://www.w3.org/2001/XMLSchema-instance"
          current_namespace = root.tag.split("}", 1)[0][1:] if "}" in root.tag else ""
          if current_namespace != namespace:
              for element in root.iter():
                  name = element.tag.split("}", 1)[-1]
                  element.tag = f"{{{namespace}}}{name}"
              root.set(f"{{{xsi}}}schemaLocation", f"{namespace} https://maven.apache.org/xsd/settings-1.3.0.xsd")

          q = lambda name: f"{{{namespace}}}{name}"
          servers = root.find(q("servers"))
          server = next((item for item in (servers if servers is not None else []) if item.findtext(q("id")) == "central"), None)
          if server is None:
              raise SystemExit("Maven settings has no server with id 'central'")
          origins = server.find(q("repositoryOrigins"))
          if origins is None:
              origins = ET.SubElement(server, q("repositoryOrigins"))
          origin = "https://central.sonatype.com"
          if not any(item.text == origin for item in origins):
              ET.SubElement(origins, q("repositoryOrigin")).text = origin

          ET.register_namespace("", namespace)
          ET.register_namespace("xsi", xsi)
          tree.write(settings, encoding="UTF-8", xml_declaration=True)
          PY

      - name: Build, verify, and publish snapshot
        env:
          SKIP_TESTS: ${{ inputs.skip-tests }}
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: |
          EXTRA_ARGS=""
          if [ "$SKIP_TESTS" = "true" ]; then
            EXTRA_ARGS="-DskipTests"
          fi
          ./mvnw clean deploy -B -ntp ${EXTRA_ARGS}
