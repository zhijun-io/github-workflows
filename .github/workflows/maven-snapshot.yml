# Reusable Snapshot Publishing Workflow for Zhijun IO Projects
#
# Publishes a -SNAPSHOT version to Maven Central using ./mvnw. The project POM
# (or its parent) must declare the `central` snapshot repository in
# <distributionManagement>.
#
# Usage in calling repository:
# jobs:
#   snapshot:
#     uses: zhijun-io/github-workflows/.github/workflows/maven-snapshot.yml@main
#     secrets:
#       MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
#       MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

name: Maven Snapshot

on:
  workflow_call:
    inputs:
      java-version:
        description: 'Java version to use'
        required: false
        type: string
        default: '17'
      java-distribution:
        description: 'Java distribution to use'
        required: false
        type: string
        default: 'temurin'
      skip-tests:
        description: 'Skip running tests before publish'
        required: false
        type: boolean
        default: false
      verify-first:
        description: 'Run verify before deploy'
        required: false
        type: boolean
        default: true
      timeout-minutes:
        description: 'Maximum job runtime'
        required: false
        type: number
        default: 60
    secrets:
      MAVEN_USERNAME:
        description: 'Maven Central username'
        required: true
      MAVEN_PASSWORD:
        description: 'Maven Central password/token'
        required: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.java-distribution }}
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Build and verify
        if: ${{ inputs.verify-first }}
        env:
          SKIP_TESTS: ${{ inputs.skip-tests }}
        run: |
          EXTRA_ARGS=""
          if [ "$SKIP_TESTS" = "true" ]; then
            EXTRA_ARGS="-DskipTests"
          fi
          ./mvnw clean verify -B -ntp ${EXTRA_ARGS}

      - name: Publish snapshot to Maven Central
        run: ./mvnw deploy -B -ntp -DskipTests
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
