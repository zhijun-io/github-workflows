# Runs self-hosted Renovate so action references and the pinned actionlint
# version stay current instead of rotting until a release breaks.
#
# RENOVATE_TOKEN must be a fine-grained PAT (or GitHub App installation token)
# with write access to this repository and the `workflow` scope. Renovate merges
# with that token, so its own PRs can run the lint workflow and be automerged -
# a merge made with the default GITHUB_TOKEN would not trigger checks.

name: Renovate

on:
  schedule:
    - cron: '30 1 * * 1-5' # 09:30 Asia/Shanghai, weekdays
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      # Renovate bumps this SHA; the Renovate engine version follows the action.
      - name: Renovate
        uses: renovatebot/github-action@e26264186543fd355dc60776e21f7fbb67ce6f85 # v46.3.2
        with:
          configurationFile: .github/renovate.json5
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: info
